<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Knowledge Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.5/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        .document-content img {
            max-width: 100%;
        }
        .fade-in {
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .loader {
            border-top-color: #3498db;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hljs {
            background: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // Main application code
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // Mock AI processing functions (would connect to real APIs in production)
        const mockAIAnalysis = async (text, type) => {
            // Simulate processing time
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            switch(type) {
                case 'summary':
                    return `This document discusses ${text.slice(0, 30)}... with key points about ${text.slice(100, 130)}...`;
                case 'entities':
                    const entities = [];
                    const words = text.split(' ');
                    const potentialEntities = ['AI', 'machine learning', 'data', 'algorithm', 'neural network', 'deep learning', 'NLP'];
                    
                    potentialEntities.forEach(entity => {
                        if (text.toLowerCase().includes(entity.toLowerCase())) {
                            entities.push({
                                text: entity,
                                type: 'TECHNOLOGY',
                                mentions: Math.floor(Math.random() * 5) + 1
                            });
                        }
                    });
                    
                    return entities;
                case 'sentiment':
                    const sentiments = ['positive', 'negative', 'neutral'];
                    return {
                        overall: sentiments[Math.floor(Math.random() * 3)],
                        score: (Math.random() * 2 - 1).toFixed(2)
                    };
                case 'questions':
                    return [
                        'What are the main concepts presented in this document?',
                        'How does this relate to recent developments in AI?',
                        'What implementation challenges might arise from these ideas?'
                    ];
                default:
                    return 'Analysis complete';
            }
        };

        const mockAnswerQuestion = async (question, context) => {
            await new Promise(resolve => setTimeout(resolve, 1000));
            return `Based on the document content, ${question} can be answered by considering ${context.slice(0, 100)}... The analysis suggests that this relates to modern AI techniques and applications in knowledge management.`;
        };

        const mockSimilarDocuments = async (text) => {
            await new Promise(resolve => setTimeout(resolve, 800));
            return [
                { title: "Advanced Neural Networks", relevance: 0.89 },
                { title: "Knowledge Graph Applications", relevance: 0.76 },
                { title: "Modern NLP Techniques", relevance: 0.72 }
            ];
        };

        // Component for document processing and visualization
        const DocumentProcessor = ({ onProcessed }) => {
            const [documents, setDocuments] = useState([]);
            const [activeTab, setActiveTab] = useState('upload');
            const [processing, setProcessing] = useState(false);
            const [currentDoc, setCurrentDoc] = useState(null);
            const fileInputRef = useRef(null);
            
            const handleFileUpload = async (event) => {
                const files = event.target.files;
                if (files.length === 0) return;
                
                setProcessing(true);
                
                try {
                    const newDocs = [];
                    
                    for (let i = 0; i < files.length; i++) {
                        const file = files[i];
                        const fileType = file.name.split('.').pop().toLowerCase();
                        let content = '';
                        
                        if (fileType === 'txt') {
                            content = await file.text();
                        } else if (fileType === 'csv') {
                            const csvText = await file.text();
                            const result = Papa.parse(csvText, { header: true });
                            content = JSON.stringify(result.data, null, 2);
                        } else if (['xlsx', 'xls'].includes(fileType)) {
                            const data = await file.arrayBuffer();
                            const workbook = XLSX.read(data);
                            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                            const jsonData = XLSX.utils.sheet_to_json(worksheet);
                            content = JSON.stringify(jsonData, null, 2);
                        } else if (fileType === 'docx') {
                            const arrayBuffer = await file.arrayBuffer();
                            const result = await mammoth.extractRawText({ arrayBuffer });
                            content = result.value;
                        } else if (fileType === 'md') {
                            content = await file.text();
                        } else if (['pdf', 'jpg', 'png'].includes(fileType)) {
                            content = `[This is a placeholder for ${fileType.toUpperCase()} content processing]`;
                        } else {
                            content = `Unsupported file type: ${fileType}`;
                        }
                        
                        newDocs.push({
                            id: Date.now() + i,
                            name: file.name,
                            type: fileType,
                            size: file.size,
                            content,
                            uploadDate: new Date(),
                            analyzed: false
                        });
                    }
                    
                    setDocuments(prev => [...prev, ...newDocs]);
                    
                    if (newDocs.length > 0 && !currentDoc) {
                        setCurrentDoc(newDocs[0]);
                    }
                } catch (error) {
                    console.error("Error processing files:", error);
                }
                
                setProcessing(false);
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
            };
            
            const analyzeDocument = async (doc) => {
                if (!doc || doc.analyzed) return;
                
                setProcessing(true);
                
                try {
                    const [summary, entities, sentiment, questions, relatedDocs] = await Promise.all([
                        mockAIAnalysis(doc.content, 'summary'),
                        mockAIAnalysis(doc.content, 'entities'),
                        mockAIAnalysis(doc.content, 'sentiment'),
                        mockAIAnalysis(doc.content, 'questions'),
                        mockSimilarDocuments(doc.content)
                    ]);
                    
                    const updatedDoc = {
                        ...doc,
                        analysis: {
                            summary,
                            entities,
                            sentiment,
                            questions,
                            relatedDocuments: relatedDocs
                        },
                        analyzed: true
                    };
                    
                    setDocuments(docs => docs.map(d => d.id === doc.id ? updatedDoc : d));
                    setCurrentDoc(updatedDoc);
                    
                    if (onProcessed) {
                        onProcessed(updatedDoc);
                    }
                } catch (error) {
                    console.error("Error analyzing document:", error);
                }
                
                setProcessing(false);
            };
            
            const renderDocumentContent = (doc) => {
                if (!doc) return null;
                
                if (doc.type === 'md') {
                    return (
                        <div 
                            className="document-content p-4 bg-white rounded shadow"
                            dangerouslySetInnerHTML={{ __html: marked.parse(doc.content) }}
                        />
                    );
                }
                
                if (['csv', 'xlsx', 'xls'].includes(doc.type)) {
                    try {
                        const data = JSON.parse(doc.content);
                        return (
                            <div className="overflow-x-auto bg-white rounded shadow">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            {Object.keys(data[0] || {}).map(key => (
                                                <th key={key} className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                                    {key}
                                                </th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-200">
                                        {data.slice(0, 10).map((row, i) => (
                                            <tr key={i}>
                                                {Object.values(row).map((cell, j) => (
                                                    <td key={j} className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                        {typeof cell === 'object' ? JSON.stringify(cell) : cell}
                                                    </td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {data.length > 10 && (
                                    <div className="p-3 text-gray-500 text-sm">
                                        Showing 10 of {data.length} rows
                                    </div>
                                )}
                            </div>
                        );
                    } catch {
                        return <pre className="p-4 bg-white rounded shadow overflow-x-auto">{doc.content}</pre>;
                    }
                }
                
                return <pre className="p-4 bg-white rounded shadow overflow-x-auto">{doc.content}</pre>;
            };
            
            const deleteDocument = (docId) => {
                setDocuments(docs => docs.filter(d => d.id !== docId));
                if (currentDoc && currentDoc.id === docId) {
                    const remaining = documents.filter(d => d.id !== docId);
                    setCurrentDoc(remaining.length > 0 ? remaining[0] : null);
                }
            };

            const renderAnalysis = (doc) => {
                if (!doc || !doc.analyzed) return null;
                
                const { analysis } = doc;
                
                return (
                    <div className="bg-white rounded shadow p-4 space-y-6 fade-in">
                        <div>
                            <h3 className="font-bold text-lg text-indigo-700 mb-2">Summary</h3>
                            <p className="text-gray-700">{analysis.summary}</p>
                        </div>
                        
                        <div>
                            <h3 className="font-bold text-lg text-indigo-700 mb-2">Entities</h3>
                            <div className="flex flex-wrap gap-2">
                                {analysis.entities.map((entity, idx) => (
                                    <span key={idx} className="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-sm">
                                        {entity.text} ({entity.mentions})
                                    </span>
                                ))}
                            </div>
                        </div>
                        
                        <div>
                            <h3 className="font-bold text-lg text-indigo-700 mb-2">Sentiment</h3>
                            <div className="flex items-center">
                                <div className={`w-4 h-4 rounded-full mr-2 ${
                                    analysis.sentiment.overall === 'positive' ? 'bg-green-500' :
                                    analysis.sentiment.overall === 'negative' ? 'bg-red-500' : 'bg-gray-500'
                                }`}></div>
                                <span className="text-gray-700 capitalize">
                                    {analysis.sentiment.overall} ({analysis.sentiment.score})
                                </span>
                            </div>
                        </div>
                        
                        <div>
                            <h3 className="font-bold text-lg text-indigo-700 mb-2">Generated Questions</h3>
                            <ul className="list-disc pl-5 text-gray-700 space-y-1">
                                {analysis.questions.map((question, idx) => (
                                    <li key={idx}>{question}</li>
                                ))}
                            </ul>
                        </div>
                        
                        <div>
                            <h3 className="font-bold text-lg text-indigo-700 mb-2">Related Documents</h3>
                            <ul className="space-y-2">
                                {analysis.relatedDocuments.map((doc, idx) => (
                                    <li key={idx} className="flex items-center justify-between">
                                        <span className="text-gray-700">{doc.title}</span>
                                        <div className="flex items-center">
                                            <div className="w-20 bg-gray-200 rounded-full h-2.5 mr-2">
                                                <div 
                                                    className="bg-indigo-600 h-2.5 rounded-full" 
                                                    style={{ width: `${doc.relevance * 100}%` }}
                                                ></div>
                                            </div>
                                            <span className="text-xs text-gray-500">{(doc.relevance * 100).toFixed(0)}%</span>
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full">
                    <div className="bg-white shadow-sm">
                        <div className="flex border-b">
                            <button
                                className={`px-4 py-2 font-medium ${activeTab === 'upload' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500'}`}
                                onClick={() => setActiveTab('upload')}
                            >
                                Upload Documents
                            </button>
                            <button
                                className={`px-4 py-2 font-medium ${activeTab === 'library' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500'}`}
                                onClick={() => setActiveTab('library')}
                                disabled={documents.length === 0}
                            >
                                Document Library ({documents.length})
                            </button>
                            <button
                                className={`px-4 py-2 font-medium ${activeTab === 'analysis' ? 'text-indigo-600 border-b-2 border-indigo-600' : 'text-gray-500'}`}
                                onClick={() => setActiveTab('analysis')}
                                disabled={!currentDoc || !currentDoc.analyzed}
                            >
                                Analysis
                            </button>
                        </div>
                    </div>
                    
                    <div className="flex-grow p-4">
                        {activeTab === 'upload' && (
                            <div className="flex flex-col items-center justify-center h-full">
                                <div className="bg-white p-6 rounded-lg shadow-md max-w-lg w-full">
                                    <h2 className="text-xl font-bold text-center mb-4">Upload Documents</h2>
                                    <div 
                                        className="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center"
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={(e) => {
                                            e.preventDefault();
                                            handleFileUpload({ target: { files: e.dataTransfer.files } });
                                        }}
                                    >
                                        <svg className="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                                        </svg>
                                        <p className="mt-2 text-sm text-gray-600">
                                            Drag and drop files here, or
                                            <label className="ml-1 text-indigo-600 hover:text-indigo-500 cursor-pointer">
                                                browse
                                                <input 
                                                    type="file" 
                                                    multiple 
                                                    className="hidden" 
                                                    onChange={handleFileUpload} 
                                                    ref={fileInputRef}
                                                />
                                            </label>
                                        </p>
                                        <p className="mt-1 text-xs text-gray-500">
                                            Supports TXT, CSV, XLSX, DOCX, MD files
                                        </p>
                                    </div>
                                    
                                    {processing && (
                                        <div className="flex justify-center mt-4">
                                            <div className="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8"></div>
                                            <span className="ml-2 text-gray-600">Processing...</span>
                                        </div>
                                    )}
                                    
                                    {documents.length > 0 && (
                                        <div className="mt-4 text-center">
                                            <p className="text-sm text-gray-600">
                                                {documents.length} document{documents.length !== 1 ? 's' : ''} uploaded
                                            </p>
                                            <button
                                                className="mt-2 px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition"
                                                onClick={() => setActiveTab('library')}
                                            >
                                                View Library
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'library' && documents.length > 0 && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 h-full">
                                <div className="bg-white rounded shadow p-4 lg:col-span-1 h-full overflow-y-auto">
                                    <h2 className="text-lg font-bold mb-4">Your Documents</h2>
                                    <div className="space-y-3">
                                        {documents.map(doc => (
                                            <div 
                                                key={doc.id} 
                                                className={`p-3 rounded-lg border flex justify-between items-center cursor-pointer ${
                                                    currentDoc && currentDoc.id === doc.id ? 'bg-indigo-50 border-indigo-300' : 'hover:bg-gray-50 border-gray-200'
                                                }`}
                                                onClick={() => setCurrentDoc(doc)}
                                            >
                                                <div className="flex items-center">
                                                    <div className="mr-3">
                                                        <svg className="h-8 w-8 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fillRule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clipRule="evenodd" />
                                                        </svg>
                                                    </div>
                                                    <div>
                                                        <div className="font-medium truncate max-w-xs">{doc.name}</div>
                                                        <div className="text-xs text-gray-500">
                                                            {(doc.size / 1024).toFixed(1)} KB • {doc.type.toUpperCase()}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex items-center">
                                                    {doc.analyzed ? (
                                                        <span className="bg-green-100 text-green-800 text-xs px-2 py-1 rounded mr-2">
                                                            Analyzed
                                                        </span>
                                                    ) : (
                                                        <button 
                                                            className="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded mr-2"
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                analyzeDocument(doc);
                                                            }}
                                                        >
                                                            Analyze
                                                        </button>
                                                    )}
                                                    <button 
                                                        className="text-gray-400 hover:text-red-500"
                                                        onClick={(e) => {
                                                            e.stopPropagation();
                                                            deleteDocument(doc.id);
                                                        }}
                                                    >
                                                        <svg className="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                                            <path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                
                                <div className="lg:col-span-2 space-y-4">
                                    {currentDoc ? (
                                        <>
                                            <div className="bg-white rounded shadow p-4">
                                                <div className="flex justify-between items-center mb-4">
                                                    <h2 className="text-lg font-bold">{currentDoc.name}</h2>
                                                    <div className="flex space-x-2">
                                                        {!currentDoc.analyzed && (
                                                            <button 
                                                                className="px-3 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition"
                                                                onClick={() => analyzeDocument(currentDoc)}
                                                                disabled={processing}
                                                            >
                                                                {processing ? 'Processing...' : 'Analyze Document'}
                                                            </button>
                                                        )}
                                                        {currentDoc.analyzed && (
                                                            <button 
                                                                className="px-3 py-1 bg-indigo-100 text-indigo-700 text-sm rounded hover:bg-indigo-200 transition"
                                                                onClick={() => setActiveTab('analysis')}
                                                            >
                                                                View Analysis
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                                {renderDocumentContent(currentDoc)}
                                            </div>
                                        </>
                                    ) : (
                                        <div className="bg-white rounded shadow p-8 text-center">
                                            <p className="text-gray-500">Select a document to view its content</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'analysis' && currentDoc && currentDoc.analyzed && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
                                <div className="lg:col-span-1">
                                    {renderAnalysis(currentDoc)}
                                </div>
                                <div className="lg:col-span-2">
                                    <AIInteraction document={currentDoc} />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // Component for AI interaction
        const AIInteraction = ({ document }) => {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [processing, setProcessing] = useState(false);
            const messagesEndRef = useRef(null);
            
            useEffect(() => {
                if (document && document.analyzed && messages.length === 0) {
                    // Add a welcome message when document is first analyzed
                    setMessages([
                        {
                            role: 'assistant',
                            content: `I've analyzed your document "${document.name}". Feel free to ask me questions about it or request further analysis.`
                        }
                    ]);
                }
            }, [document, messages.length]);
            
            useEffect(() => {
                // Scroll to bottom of messages
                if (messagesEndRef.current) {
                    messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [messages]);
            
            const handleSendMessage = async () => {
                if (!input.trim() || !document || processing) return;
                
                const userMessage = input.trim();
                setInput('');
                setProcessing(true);
                
                setMessages(prev => [...prev, { role: 'user', content: userMessage }]);
                
                try {
                    const response = await mockAnswerQuestion(userMessage, document.content);
                    
                    setTimeout(() => {
                        setMessages(prev => [...prev, { role: 'assistant', content: response }]);
                        setProcessing(false);
                    }, 1000);
                } catch (error) {
                    console.error("Error getting response:", error);
                    setMessages(prev => [...prev, { 
                        role: 'assistant', 
                        content: "I'm sorry, I encountered an error processing your request." 
                    }]);
                    setProcessing(false);
                }
            };
            
            // Predefined question suggestions
            const questionSuggestions = document?.analysis?.questions || [
                "Can you summarize this document?",
                "What are the key entities mentioned?",
                "How would you analyze the main themes?"
            ];
            
            return (
                <div className="bg-white rounded shadow flex flex-col h-full">
                    <div className="p-4 border-b">
                        <h2 className="text-lg font-bold">Ask Questions</h2>
                        <p className="text-sm text-gray-600">
                            I can answer questions about your document or provide additional insights
                        </p>
                    </div>
                    
                    <div className="flex-grow p-4 overflow-y-auto">
                        <div className="space-y-4">
                            {messages.map((message, idx) => (
                                <div 
                                    key={idx} 
                                    className={`flex ${message.role === 'user' ? 'justify-end' : 'justify-start'}`}
                                >
                                    <div 
                                        className={`max-w-3/4 rounded-lg p-3 ${
                                            message.role === 'user' 
                                                ? 'bg-indigo-100 text-indigo-800' 
                                                : 'bg-gray-100 text-gray-800'
                                        }`}
                                    >
                                        {message.content}
                                    </div>
                                </div>
                            ))}
                            {processing && (
                                <div className="flex justify-start fade-in">
                                    <div className="bg-gray-100 text-gray-800 rounded-lg p-3 max-w-3/4">
                                        <div className="flex items-center space-x-2">
                                            <div className="loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-4 w-4"></div>
                                            <span>Thinking...</span>
                                        </div>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>
                    </div>
                    
                    <div className="p-4 border-t">
                        <div className="flex flex-wrap gap-2 mb-3">
                            {questionSuggestions.map((question, idx) => (
                                <button
                                    key={idx}
                                    className="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm hover:bg-gray-200 transition"
                                    onClick={() => setInput(question)}
                                    disabled={processing}
                                >
                                    {question}
                                </button>
                            ))}
                        </div>
                        <div className="flex">
                            <input
                                type="text"
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                placeholder="Ask a question about your document..."
                                className="flex-grow px-4 py-2 border rounded-l focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                                disabled={processing}
                            />
                            <button
                                className="px-4 py-2 bg-indigo-600 text-white rounded-r hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition"
                                onClick={handleSendMessage}
                                disabled={processing || !input.trim()}
                            >
                                <svg className="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                                    <path fillRule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clipRule="evenodd" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // Knowledge graph visualization component
        const KnowledgeGraph = ({ document }) => {
            const [graphData, setGraphData] = useState(null);
            
            useEffect(() => {
                if (document && document.analyzed) {
                    // Generate mock graph data based on document entities
                    const entities = document.analysis.entities || [];
                    
                    // Create nodes for document and entities
                    const nodes = [
                        { id: 'doc', label: document.name.slice(0, 15) + (document.name.length > 15 ? '...' : ''), type: 'document' }
                    ];
                    
                    entities.forEach(entity => {
                        nodes.push({
                            id: `entity-${entity.text}`,
                            label: entity.text,
                            type: 'entity',
                            mentions: entity.mentions
                        });
                    });
                    
                    // Create links between document and entities
                    const links = entities.map(entity => ({
                        source: 'doc',
                        target: `entity-${entity.text}`,
                        value: entity.mentions
                    }));
                    
                    // Create some links between entities to make the graph more interesting
                    for (let i = 0; i < entities.length; i++) {
                        for (let j = i + 1; j < entities.length; j++) {
                            if (Math.random() > 0.6) { // 40% chance of creating a link
                                links.push({
                                    source: `entity-${entities[i].text}`,
                                    target: `entity-${entities[j].text}`,
                                    value: 1
                                });
                            }
                        }
                    }
                    
                    setGraphData({ nodes, links });
                }
            }, [document]);
            
            // If using D3.js, this would render the graph
            // For now, let's create a simple visual representation
            
            return (
                <div className="bg-white rounded shadow p-4">
                    <h2 className="text-lg font-bold mb-4">Knowledge Graph</h2>
                    
                    {graphData ? (
                        <div className="border rounded p-4 h-64 bg-gray-50 relative">
                            {/* Simple visualization for demo purposes */}
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                                <div className="w-16 h-16 rounded-full bg-indigo-100 border-2 border-indigo-500 flex items-center justify-center text-center text-xs p-1">
                                    {graphData.nodes[0].label}
                                </div>
                            </div>
                            
                            {graphData.nodes.slice(1).map((node, idx) => {
                                const angle = (2 * Math.PI * idx) / (graphData.nodes.length - 1);
                                const radius = 120;
                                const x = Math.cos(angle) * radius;
                                const y = Math.sin(angle) * radius;
                                
                                return (
                                    <React.Fragment key={node.id}>
                                        <div 
                                            className="absolute w-12 h-12 rounded-full bg-blue-100 border-2 border-blue-400 flex items-center justify-center text-center text-xs p-1"
                                            style={{ 
                                                top: `calc(50% + ${y}px)`,
                                                left: `calc(50% + ${x}px)`,
                                                transform: 'translate(-50%, -50%)'
                                            }}
                                        >
                                            {node.label}
                                        </div>
                                        <svg 
                                            className="absolute top-0 left-0 w-full h-full pointer-events-none"
                                            style={{ zIndex: 0 }}
                                        >
                                            <line 
                                                x1="50%" 
                                                y1="50%" 
                                                x2={`calc(50% + ${x}px)`} 
                                                y2={`calc(50% + ${y}px)`}
                                                stroke="#a5b4fc"
                                                strokeWidth="2"
                                                strokeDasharray="4"
                                            />
                                        </svg>
                                    </React.Fragment>
                                );
                            })}
                            
                            <div className="absolute bottom-2 right-2 text-xs text-gray-500">
                                Demo visualization (would use D3.js in production)
                            </div>
                        </div>
                    ) : (
                        <div className="border rounded p-4 h-64 bg-gray-50 flex items-center justify-center">
                            <p className="text-gray-500">Analyze a document to generate a knowledge graph</p>
                        </div>
                    )}
                </div>
            );
        };

        // Create a Code Generator component for AI-generated code
        const CodeGenerator = ({ document }) => {
            const [code, setCode] = useState('');
            const [language, setLanguage] = useState('python');
            const [task, setTask] = useState('');
            const [generating, setGenerating] = useState(false);
            
            const generateCode = async () => {
                if (!document || !task.trim()) return;
                
                setGenerating(true);
                
                // Mock code generation based on document content and task
                try {
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    let generatedCode = '';
                    
                    if (language === 'python') {
                        generatedCode = `# Generated code for task: ${task}
# Based on document: ${document.name}

import pandas as pd
import numpy as np
from sklearn.feature_extraction.text import TfidfVectorizer
from sklearn.metrics.pairwise import cosine_similarity

def analyze_document(text):
    """
    Analyze document content using NLP techniques
    """
    # Preprocessing
    lines = text.split('\\n')
    clean_text = ' '.join([line.strip() for line in lines if line.strip()])
    
    # Simple keyword extraction
    words = clean_text.lower().split()
    word_freq = {}
    for word in words:
        if len(word) > 3:  # Filter out short words
            word_freq[word] = word_freq.get(word, 0) + 1
    
    # Get top keywords
    top_keywords = sorted(word_freq.items(), key=lambda x: x[1], reverse=True)[:10]
    
    # Create semantic embedding (simplified)
    vectorizer = TfidfVectorizer()
    vectors = vectorizer.fit_transform([clean_text])
    
    return {
        'word_count': len(words),
        'top_keywords': top_keywords,
        'vector_representation': vectors
    }

# Example usage with document content

print(f"Word count: {results['word_count']}")
print("Top keywords:")
for keyword, count in results['top_keywords']:
    print(f"  - {keyword}: {count}")`;
                    } else if (language === 'javascript') {
                        generatedCode = `// Generated code for task: ${task}
// Based on document: ${document.name}

/**
 * Analyze document content using basic NLP techniques
 * @param {string} text - Document content
 * @returns {object} Analysis results
 */
function analyzeDocument(text) {
  // Preprocessing
  const lines = text.split('\\n');
  const cleanText = lines.filter(line => line.trim()).join(' ');
  
  // Simple keyword extraction
  const words = cleanText.toLowerCase().split(/\\s+/);
  const wordFreq = {};
  
  words.forEach(word => {
    if (word.length > 3) {  // Filter out short words
      wordFreq[word] = (wordFreq[word] || 0) + 1;
    }
  });
  
  // Get top keywords
  const topKeywords = Object.entries(wordFreq)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);
  
  // Create simple vector representation
  const uniqueWords = [...new Set(words.filter(w => w.length > 3))];
  const vector = uniqueWords.map(word => wordFreq[word] / words.length);
  
  return {
    wordCount: words.length,
    topKeywords,
    vectorRepresentation: vector
  };
}

// Example usage with document content

console.log(\`Word count: \${results.wordCount}\`);

results.topKeywords.forEach(([keyword, count]) => {
  console.log(\`  - \${keyword}: \${count}\`);
});`;
                    } else if (language === 'r') {
                        generatedCode = `# Generated code for task: ${task}
# Based on document: ${document.name}

# Load required libraries
library(tidytext)
library(dplyr)
library(stringr)

# Function to analyze document content
analyze_document <- function(text) {
  # Preprocessing
  lines <- str_split(text, "\\n")[[1]]
  clean_text <- paste(trimws(lines[nzchar(trimws(lines))]), collapse = " ")
  
  # Tokenize text
  words <- unlist(str_split(tolower(clean_text), "\\\\s+"))
  words <- words[nchar(words) > 3]  # Filter out short words
  
  # Count word frequencies
  word_freq <- table(words)
  word_df <- data.frame(
    word = names(word_freq),
    count = as.numeric(word_freq),
    stringsAsFactors = FALSE
  )
  
  # Sort by frequency
  top_keywords <- word_df %>%
    arrange(desc(count)) %>%
    head(10)
  
  # Return results
  list(
    word_count = length(words),
    top_keywords = top_keywords,
    document_length = nchar(clean_text)
  )
}

# Example usage with document content
sample_text <- "${document.content.slice(0, 200)}..."
results <- analyze_document(sample_text)

cat("Word count:", results$word_count, "\\n")
cat("Top keywords:\\n")
print(results$top_keywords)`;
                    }
                    
                    setCode(generatedCode);
                } catch (error) {
                    console.error("Error generating code:", error);
                    setCode("// Error generating code. Please try again.");
                }
                
                setGenerating(false);
            };
            
            useEffect(() => {
                // Highlight code when it changes
                if (code) {
                    document.querySelectorAll('pre code').forEach((block) => {
                        hljs.highlightElement(block);
                    });
                }
            }, [code]);
            
            return (
                <div className="bg-white rounded shadow p-4">
                    <h2 className="text-lg font-bold mb-4">Code Generator</h2>
                    
                    <div className="mb-4">
                        <label className="block text-sm font-medium text-gray-700 mb-1">
                            Programming Language
                        </label>
                        <select
                            value={language}
                            onChange={(e) => setLanguage(e.target.value)}
                            className="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                            <option value="python">Python</option>
                            <option value="javascript">JavaScript</option>
                            <option value="r">R</option>
                        </select>
                    </div>
                    
                    <div className="mb-4">
                        <label className="block text-sm font-medium text-gray-700 mb-1">
                            Task Description
                        </label>
                        <input
                            type="text"
                            value={task}
                            onChange={(e) => setTask(e.target.value)}
                            placeholder="e.g., Extract keywords from document"
                            className="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                    </div>
                    
                    <div className="mb-4">
                        <button
                            className="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition"
                            onClick={generateCode}
                            disabled={generating || !document || !task.trim()}
                        >
                            {generating ? 'Generating...' : 'Generate Code'}
                        </button>
                    </div>
                    
                    {code && (
                        <div className="mt-4">
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-medium">Generated Code</h3>
                                <button
                                    className="text-indigo-600 text-sm"
                                    onClick={() => {
                                        navigator.clipboard.writeText(code);
                                        alert('Code copied to clipboard!');
                                    }}
                                >
                                    Copy Code
                                </button>
                            </div>
                            <pre className="bg-gray-800 text-white p-4 rounded overflow-x-auto">
                                <code className={language}>{code}</code>
                            </pre>
                        </div>
                    )}
                </div>
            );
        };

        // Main App component
        const App = () => {
            const [activeDocument, setActiveDocument] = useState(null);
            const [activeTab, setActiveTab] = useState('upload');
            
            const handleDocumentProcessed = (document) => {
                setActiveDocument(document);
                setActiveTab('insights');
            };
            
            return (
                <div className="container mx-auto p-4 max-w-screen-xl">
                    <header className="bg-indigo-700 text-white p-4 rounded-lg shadow-lg mb-6">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center">
                                <svg className="h-8 w-8 mr-3" fill="currentColor" viewBox="0 0 20 20">
                                    <path fillRule="evenodd" d="M9.504 1.132a1 1 0 01.992 0l1.75 1a1 1 0 11-.992 1.736L10 3.152l-1.254.716a1 1 0 11-.992-1.736l1.75-1zM5.618 4.504a1 1 0 01-.372 1.364L5.016 6l.23.132a1 1 0 11-.992 1.736L4 7.723V8a1 1 0 01-2 0V6a.996.996 0 01.52-.878l1.734-.99a1 1 0 011.364.372zm8.764 0a1 1 0 011.364-.372l1.733.99A1.002 1.002 0 0118 6v2a1 1 0 11-2 0v-.277l-.254.145a1 1 0 11-.992-1.736l.23-.132-.23-.132a1 1 0 01-.372-1.364zm-7 4a1 1 0 011.364-.372L10 8.848l1.254-.716a1 1 0 11.992 1.736L11 10.58V12a1 1 0 11-2 0v-1.42l-1.246-.712a1 1 0 01-.372-1.364zM3 11a1 1 0 011 1v1.42l1.246.712a1 1 0 11-.992 1.736l-1.75-1A1 1 0 012 14v-2a1 1 0 011-1zm14 0a1 1 0 011 1v2a1 1 0 01-.504.868l-1.75 1a1 1 0 11-.992-1.736L16 13.42V12a1 1 0 011-1zm-9.618 5.504a1 1 0 011.364-.372l.254.145V16a1 1 0 112 0v.277l.254-.145a1 1 0 11.992 1.736l-1.735.992a.995.995 0 01-1.022 0l-1.735-.992a1 1 0 01-.372-1.364z" clipRule="evenodd" />
                                </svg>
                                <div>
                                    <h1 className="text-2xl font-bold">Smart Knowledge Assistant</h1>
                                    <p className="text-indigo-200 text-sm">AI-powered document analysis and knowledge management</p>
                                </div>
                            </div>
                            <div className="hidden md:block">
                                <div className="flex space-x-4 text-sm">
                                    <button 
                                        className={`px-3 py-1 rounded ${activeTab === 'upload' ? 'bg-white text-indigo-700' : 'text-white hover:bg-indigo-600'}`}
                                        onClick={() => setActiveTab('upload')}
                                    >
                                        Upload & Process
                                    </button>
                                    <button 
                                        className={`px-3 py-1 rounded ${activeTab === 'insights' ? 'bg-white text-indigo-700' : 'text-white hover:bg-indigo-600'}`}
                                        onClick={() => setActiveTab('insights')}
                                        disabled={!activeDocument}
                                    >
                                        AI Insights
                                    </button>
                                    <button 
                                        className={`px-3 py-1 rounded ${activeTab === 'interact' ? 'bg-white text-indigo-700' : 'text-white hover:bg-indigo-600'}`}
                                        onClick={() => setActiveTab('interact')}
                                        disabled={!activeDocument}
                                    >
                                        Ask AI
                                    </button>
                                    <button 
                                        className={`px-3 py-1 rounded ${activeTab === 'tools' ? 'bg-white text-indigo-700' : 'text-white hover:bg-indigo-600'}`}
                                        onClick={() => setActiveTab('tools')}
                                        disabled={!activeDocument}
                                    >
                                        AI Tools
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    <main className="bg-gray-50 rounded-lg shadow-md min-h-screen">
                        {activeTab === 'upload' && (
                            <DocumentProcessor onProcessed={handleDocumentProcessed} />
                        )}
                        
                        {activeTab === 'insights' && activeDocument && (
                            <div className="p-4">
                                <h2 className="text-xl font-bold mb-4">AI-Generated Insights</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-white rounded shadow p-4">
                                        <h3 className="font-bold text-lg text-indigo-700 mb-2">Document Summary</h3>
                                        <p className="text-gray-700">{activeDocument.analysis.summary}</p>
                                        
                                        <h3 className="font-bold text-lg text-indigo-700 mt-4 mb-2">Key Entities</h3>
                                        <div className="flex flex-wrap gap-2">
                                            {activeDocument.analysis.entities.map((entity, idx) => (
                                                <span key={idx} className="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-sm">
                                                    {entity.text} ({entity.mentions})
                                                </span>
                                            ))}
                                        </div>
                                        
                                        <h3 className="font-bold text-lg text-indigo-700 mt-4 mb-2">Document Sentiment</h3>
                                        <div className="flex items-center">
                                            <div className={`w-4 h-4 rounded-full mr-2 ${
                                                activeDocument.analysis.sentiment.overall === 'positive' ? 'bg-green-500' :
                                                activeDocument.analysis.sentiment.overall === 'negative' ? 'bg-red-500' : 'bg-gray-500'
                                            }`}></div>
                                            <span className="text-gray-700 capitalize">
                                                {activeDocument.analysis.sentiment.overall} ({activeDocument.analysis.sentiment.score})
                                            </span>
                                        </div>
                                    </div>
                                    
                                    <KnowledgeGraph document={activeDocument} />
                                </div>
                                
                                <div className="mt-4">
                                    <button
                                        className="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition"
                                        onClick={() => setActiveTab('interact')}
                                    >
                                        Ask Questions About This Document
                                    </button>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'interact' && activeDocument && (
                            <div className="p-4">
                                <h2 className="text-xl font-bold mb-4">Ask Questions About Your Document</h2>
                                <AIInteraction document={activeDocument} />
                            </div>
                        )}
                        
                        {activeTab === 'tools' && activeDocument && (
                            <div className="p-4">
                                <h2 className="text-xl font-bold mb-4">AI-Powered Tools</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <CodeGenerator document={activeDocument} />
                                    
                                    <div className="bg-white rounded shadow p-4">
                                        <h3 className="text-lg font-bold mb-4">Document Visualization</h3>
                                        <div className="border rounded p-4 bg-gray-50 relative h-64 flex items-center justify-center">
                                            <div className="text-center">
                                                <p className="text-gray-500 mb-2">AI-generated visualization based on document content</p>
                                                <button className="px-3 py-1 bg-indigo-600 text-white text-sm rounded hover:bg-indigo-700 transition">
                                                    Generate Visualization
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        // Render the app
        ReactDOM.render(
            <App />,
            document.getElementById('root')
        );
    </script>
</body>
</html>
